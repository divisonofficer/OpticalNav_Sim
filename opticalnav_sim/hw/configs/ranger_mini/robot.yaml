# AgileX Ranger Mini 2.0: the structure file of the robot itself. What stands on its deck is a rig (configs/rigs/*.yaml),
# chosen here by name and exchangeable: config.load("ranger_mini", rig="hdr_12bit_frame"), or in the viewer.
name: ranger_mini
label: Ranger Mini 2.0
description: AgileX Ranger Mini 2.0 (4륜 조향), 전면 조명 2개

base:
  type: ranger_mini2                 # four-wheel steering with the maker's numbers (hw.robots, hw.drive)
  model: ranger_mini_v3              # meshes converted from the maker's USD (tools/robot_from_usd.py), in packs/hardware;
                                     # without them the robot is drawn as boxes and cylinders of the same size
  params:                            # the maker's manual (V2.0.1, 2023.08)
    kerb_mass: 64.5
    max_payload: 80.0
    max_speed: 1.5
    max_spin: 3.259
    max_ackermann_deg: 40.0
    dynamics: true                   # wheel slip by the friction of the surface under each wheel

parts:
  # The two lamps in the front face (their lenses are in the maker's model: 123 x 45 mm at y = +-0.123, z = 0.280).
  # Colour and brightness are set over CAN on the real robot; the radiance here is an estimate, in the scene's units.
  - name: headlight_left
    type: light
    label: 전면 조명 (왼쪽)
    link: base_link
    mount: {xyz: [0.3605, 0.123, 0.280]}
    params: {size: [0.12, 0.04], color: [1.0, 1.0, 1.0], radiance: 150.0}
  - name: headlight_right
    type: light
    label: 전면 조명 (오른쪽)
    link: base_link
    mount: {xyz: [0.3605, -0.123, 0.280]}
    params: {size: [0.12, 0.04], color: [1.0, 1.0, 1.0], radiance: 150.0}

rig: hdr_12bit_mast
